[project]
name = "alpha-mini-wifi-encoder"
version = "0.2.0"
description = "Wi-Fi provisioning encoder and programming-mode (BLE/LAN) client for the UBTECH Alpha Mini."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ble", "lan", "mdns", "protobuf", "provisioning", "reverse-engineering", "alpha-mini"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "protobuf>=5.26",
    "rich>=13.7",
    "bleak>=3.1.0",
    "questionary>=2.1.1",
    "zeroconf>=0.132",
]

[project.scripts]
alpha-mini-wifi-encode = "alpha_mini_wifi_encoder.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-protobuf>=5.26",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "PLR0917", # click commands take one positional parameter per option
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "ANN401", "SLF001", "FBT001", "FBT003", "INP001", "ARG001", "ARG002", "RUF012", "PYI034", "ASYNC109", "E501"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=alpha_mini_wifi_encoder",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
